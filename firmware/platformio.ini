; ESP32 firmware for Turret Vision v2.
;   pio run -e esp32dev -t upload     (or: tv flash)
;   pio test -e native                (protocol tests on your laptop / CI)

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Stock PlatformIO platform = Arduino core 2.x (ESP-IDF 4.4), which FastAccelStepper
; supports with hardware step generation (MCPWM/PCNT). Arduino core 3.0.x would NOT compile it.
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags = -std=gnu++17 -Wall -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/gin66/FastAccelStepper.git#v0.33.9
test_ignore = test_proto

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Ilib/proto/src
test_build_src = no
